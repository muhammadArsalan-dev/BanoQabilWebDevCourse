<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prompt</title>
    <link rel="stylesheet" href="prompt.css">
</head>

<body>
    <h1>Prompt Function</h1>
    <div id="prompt-container">
        <p> Purpose: Displays a dialog box that prompts the visitor for input. It returns the text entered by the user
            as a string, or null if the user clicks cancel.<br></p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>prompt("label", "default");</code>
    </div>
</body>

</html>
