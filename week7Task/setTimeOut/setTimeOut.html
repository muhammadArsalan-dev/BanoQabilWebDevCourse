<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout</title>
    <link rel="stylesheet" href="setTimeOut.css">
</head>

<body>
    <h1>setTimeout Function</h1>
    <div id="setTimeout-container">
        <p> Purpose: Executes a specified block of code or function once after a designated delay in milliseconds.<br></p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>setTimeout(function, delay, param1, param2, ...);</code>
    </div>
</body>
