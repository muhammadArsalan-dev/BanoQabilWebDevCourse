    <link rel="stylesheet" href="clearInterval.css">
</head>

<body>
    <h1>clearInterval Function</h1>
    <div id="clearInterval-container">
        <p> Purpose: Cancels a timed repeating action previously established by a call to setInterval.<br></p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>clearInterval(intervalVariable);</code>
    </div>
