<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Operator</title>
    <link rel="stylesheet" href="RestOperator.css">
</head>

<body>
    <h1>Rest Operator</h1>
    <div id="RestOperator-container">
        <p> Purpose: Collects multiple elements into a single array, typically used in function parameters to handle indefinite arguments.<br></p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>function name(...args) { // args is an array };</code>
    </div>
</body>
