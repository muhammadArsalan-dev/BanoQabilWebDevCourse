<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
    <link rel="stylesheet" href="SpreadOperator.css">
</head>

<body>
    <h1>Spread Operator</h1>
    <div id="SpreadOperator-container">
        <p> Purpose: Allows an iterable (like an array or object) to be expanded into individual elements or properties.<br></p>
    </div>
    <div id="syntax">
        Syntax: <br>
        <code>const newArray = [...oldArray, newItem]; or const newObj = {...oldObj};</code>
    </div>
</body>

</html>
